services:
  web:
    build: services/web
    ports:
      - "7080:80"
    depends_on:
      - backend
    networks:
      - verbalink-net

  backend:
    build: services/backend
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:18080/v1}"
      LLM_MODEL: "${LLM_MODEL:-qwen3.6-35b}"
      TTS_URL: "http://tts:8001"
      TRANSCRIPTION_URL: "http://transcription:8002"
      QDRANT_URL: "http://qdrant:6333"
      DATA_DIR: "/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    networks:
      - verbalink-net

  # Independent Qdrant for verbalink's per-user transcript RAG (separate from biolab's)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6433:6333"   # host 6433 to avoid clashing with biolab's qdrant (6333)
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - verbalink-net

  tts:
    build: services/tts
    volumes:
      - tts_models:/models
    networks:
      - verbalink-net

  transcription:
    build: services/transcription
    environment:
      WHISPER_MODEL: "${WHISPER_MODEL:-medium}"
      DATA_DIR: "/data"
    volumes:
      - ./data:/data
      - whisper_models:/models
    networks:
      - verbalink-net

volumes:
  tts_models:
  whisper_models:
  qdrant_data:

networks:
  verbalink-net:
    driver: bridge
